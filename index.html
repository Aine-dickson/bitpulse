<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Light-first, no-flash: apply the persisted theme before first paint.
         Default is always light, even when the OS prefers dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bitpulse-theme')
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>

    <title>BitPulse — Embedded, Firmware & Systems Software</title>
    <meta
      name="description"
      content="BitPulse is a product & R&D studio for embedded hardware, firmware and systems software — routing ideas from bare metal to working systems."
    />

    <!-- Fonts: Archivo (display) + IBM Plex Mono (designators) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
